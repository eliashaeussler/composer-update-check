name: Tests
on:
  push:
    branches:
      - '**'

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-version }}, Composer ${{ matrix.composer-version }} & ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        composer-version: ["2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9"]
        dependencies: ["highest", "lowest"]

        # Avoid incompatible interface implementations in Composer v2.6 & symfony/console v7
        include:
          - php-version: "8.2"
            composer-version: "2.6"
            dependencies: "highest"
            composer-extra-options: '--with="symfony/console:^6.0"'
          - php-version: "8.3"
            composer-version: "2.6"
            dependencies: "highest"
            composer-extra-options: '--with="symfony/console:^6.0"'
          - php-version: "8.4"
            composer-version: "2.6"
            dependencies: "highest"
            composer-extra-options: '--with="symfony/console:^6.0"'
          - php-version: "8.5"
            composer-version: "2.6"
            dependencies: "highest"
            composer-extra-options: '--with="symfony/console:^6.0"'

        # Avoid testing PHP 8.4/8.5 with incompatible Composer versions
        exclude:
          - php-version: "8.4"
            composer-version: "2.2"
          - php-version: "8.4"
            composer-version: "2.3"
          - php-version: "8.5"
            composer-version: "2.2"
          - php-version: "8.5"
            composer-version: "2.3"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:${{ matrix.composer-version }}
          coverage: none

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: '--with="composer/composer:~${{ matrix.composer-version }}.0" ${{ matrix.composer-extra-options }}'

      # Run tests
      - name: Run tests
        run: composer test

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      # Install dependencies
      - name: Install Composer dependencies
        uses: ramsey/composer-install@4.0.0

      # Run tests
      - name: Run tests with coverage
        run: composer test:coverage

      # Upload artifact
      - name: Fix coverage path
        working-directory: .build/coverage
        run: sed -i 's#/home/runner/work/composer-update-check/composer-update-check#${{ github.workspace }}#g' clover.xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .build/coverage/clover.xml
          retention-days: 7

  coverage-report:
    name: Report test coverage
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Download artifact
      - name: Download coverage artifact
        id: download
        uses: actions/download-artifact@v8
        with:
          name: coverage

      # qlty
      - name: qlty report
        uses: qltysh/qlty-action/coverage@v2
        if: env.QLTY_COVERAGE_TOKEN
        env:
          QLTY_COVERAGE_TOKEN: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: ${{ steps.download.outputs.download-path }}/clover.xml

      # Coveralls
      - name: Coveralls report
        uses: coverallsapp/github-action@v2
        with:
          file: ${{ steps.download.outputs.download-path }}/clover.xml
