name: Release

on:
  push:
    tags:
      - '*'

jobs:
  docs:
    name: 'Build and deploy documentation'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.pages-url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@d35bc3755a6ea467539dd3d16ebe98a42b7f2f6e # 1.1.6

      - name: 'Build docs'
        env:
          COMPOSE_FILE: build/docs/docker-compose.yaml
        run: |
          docker-compose build --pull
          docker-compose run --rm docs build

      - name: 'Deploy docs'
        id: deploy
        uses: eliashaeussler/gha/.github/actions/deploy-pages@d35bc3755a6ea467539dd3d16ebe98a42b7f2f6e # 1.1.6
        with:
          base-path: 'site'

  release:
    name: 'Create release'
    uses: eliashaeussler/gha/.github/workflows/github-release.yaml@d35bc3755a6ea467539dd3d16ebe98a42b7f2f6e # 1.1.6
    permissions:
      contents: write
