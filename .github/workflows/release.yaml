name: Release

on:
  push:
    tags:
      - '*'

jobs:
  docs:
    name: 'Build and deploy documentation'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.pages-url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@c5d066ebd1c130e32d87bf7e7c8a1c3ca64bd14b # 0.8.2

      - name: 'Build docs'
        env:
          COMPOSE_FILE: build/docs/docker-compose.yaml
        run: |
          docker-compose build --pull
          docker-compose run --rm docs build

      - name: 'Deploy docs'
        id: deploy
        uses: eliashaeussler/gha/.github/actions/deploy-pages@c5d066ebd1c130e32d87bf7e7c8a1c3ca64bd14b # 0.8.2
        with:
          base-path: 'site'

  release:
    name: 'Create release'
    uses: eliashaeussler/gha/.github/workflows/github-release.yaml@c5d066ebd1c130e32d87bf7e7c8a1c3ca64bd14b # 0.8.2
    permissions:
      contents: write
