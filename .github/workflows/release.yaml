name: Release

on:
  push:
    tags:
      - '*'

jobs:
  docs:
    name: 'Build and deploy documentation'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.pages-url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@1fb632290bce95f37a13857172e1ac6bf1a821c1 # 0.8.3

      - name: 'Build docs'
        env:
          COMPOSE_FILE: build/docs/docker-compose.yaml
        run: |
          docker-compose build --pull
          docker-compose run --rm docs build

      - name: 'Deploy docs'
        id: deploy
        uses: eliashaeussler/gha/.github/actions/deploy-pages@1fb632290bce95f37a13857172e1ac6bf1a821c1 # 0.8.3
        with:
          base-path: 'site'

  release:
    name: 'Create release'
    uses: eliashaeussler/gha/.github/workflows/github-release.yaml@1fb632290bce95f37a13857172e1ac6bf1a821c1 # 0.8.3
    permissions:
      contents: write
